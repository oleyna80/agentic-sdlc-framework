# Machine-readable navigation registry for authority-bearing files and major zones.
# Register contracts and repository areas, not every file.

version: 2
scope: generated_project
project:
  name: "{{PROJECT_NAME}}"
  slug: "{{PROJECT_SLUG}}"
  root: "{{PROJECT_ROOT}}"

statuses:
  normative: "governance, product, architecture, or policy source of truth"
  derived: "artifact derived from approved normative intent"
  evidence: "review, verification, drift, consolidation, or closeout evidence"
  runtime_adapter: "runtime-specific execution configuration or guidance"
  integration_adapter: "plugin, MCP, handoff, or transport configuration"
  durable_reference: "evidence-backed engineering memory"
  operational_log: "current or historical execution state; not normative"
  generated: "tool-generated artifact; verify against current source"
  local_state: "machine-local, private, credential, cache, or runtime state"
  source: "project implementation or tests"

authority_order:
  product_and_delivery:
    - explicit_owner_instruction_or_approved_change_request
    - approved_specification
    - accepted_architecture_decisions_and_external_contracts
    - approved_implementation_plan
    - active_tasklist
    - assurance_and_closeout_reports
    - durable_engineering_memory
    - runtime_policy_and_operational_logs
    - generated_and_external_reference_artifacts
  agent_behavior:
    - explicit_owner_instruction
    - AGENTS.md
    - governance_core
    - active_work_block_scope_and_write_set
    - canonical_sdlc_protocol
    - runtime_and_integration_adapters
    - operational_logs_and_generated_artifacts

entries:
  AGENTS.md:
    role: project_operating_contract
    status: normative
    owner: owner
    update_when:
      - authority or Hard Stop rules change
      - lifecycle entry-point guidance changes
      - source or write boundaries change
    related:
      - governance/README.md
      - .agent/workflows/sdd-protocol.md
      - .agent/ROSTER.md

  governance/**:
    role: runtime_neutral_governance_core
    status: normative
    owner: architect
    update_when:
      - logical role authority changes
      - lifecycle or artifact contracts change
      - runtime capability negotiation changes
    related:
      - AGENTS.md
      - runtimes/**
      - docs/templates/work-block-template.md

  PROJECT_MAP.md:
    role: human_readable_project_map
    status: normative
    owner: architect
    update_when:
      - major directories or boundaries change
      - authority order changes
      - runtime adapters change
    related:
      - FILE_REGISTRY.yml
      - docs/session-bootstrap.md

  FILE_REGISTRY.yml:
    role: machine_readable_navigation_registry
    status: normative
    owner: architect
    update_when:
      - authority-bearing paths change
      - path status or ownership changes
      - generated/local boundaries change
    related:
      - PROJECT_MAP.md
      - docs/session-bootstrap.md

  .agent/ROSTER.md:
    role: logical_role_and_skill_router
    status: normative
    owner: architect
    update_when:
      - logical roles or authority change
      - skill routing changes
      - isolation guidance changes
    related:
      - AGENTS.md
      - .agent/workflows/sdd-protocol.md
      - runtimes/**

  .agent/workflows/sdd-protocol.md:
    role: canonical_lifecycle_contract
    status: normative
    owner: architect
    update_when:
      - stage or gate semantics change
      - review verification or drift triggers change
      - closeout rules change
    related:
      - governance/lifecycle.md
      - docs/templates/work-block-template.md
      - docs/templates/spec-drift-report-template.md

  .agent/critic-gate.md:
    role: critic_gate_state
    status: operational_log
    owner: orchestrator
    update_when:
      - active Work Block critic state changes
    related:
      - .agent/workflows/sdd-protocol.md
      - memory_bank/review-log.md

  .agent/verification-gate.md:
    role: verification_gate_state
    status: operational_log
    owner: verifier
    update_when:
      - active Work Block verification state changes
    related:
      - .agent/workflows/sdd-protocol.md
      - docs/reports/**

  .agent/skills/**:
    role: installed_portable_skills
    status: runtime_adapter
    owner: architect
    update_when:
      - project skill baseline changes
      - skill source revision changes
    related:
      - .agent/ROSTER.md
      - .agent/skills.lock.yml

  docs/specs/**:
    role: approved_product_and_technical_specifications
    status: normative
    owner: architect
    update_when:
      - approved behavior or technical contract changes
      - implementation reveals an approved requirement change
    related:
      - docs/plans/**
      - docs/tasklist/**
      - docs/reports/**

  docs/architecture/**:
    role: accepted_architecture_decisions_and_contracts
    status: normative
    owner: architect
    update_when:
      - architecture boundary or tradeoff is accepted
      - decision is superseded or retired
    related:
      - docs/specs/**
      - docs/engineering-memory/**

  docs/plans/**:
    role: approved_implementation_plans_and_work_blocks
    status: derived
    owner: orchestrator
    update_when:
      - Work Block is created revised or closed
      - specification change requires replanning
    related:
      - docs/specs/**
      - docs/templates/work-block-template.md

  docs/tasklist/**:
    role: active_task_decomposition
    status: derived
    owner: orchestrator
    update_when:
      - approved plan tasks change
      - verification changes task state
    related:
      - docs/specs/**
      - docs/plans/**

  docs/reports/**:
    role: critic_review_verification_drift_and_closeout_evidence
    status: evidence
    owner: verifier
    update_when:
      - assurance or closeout function produces evidence
    related:
      - docs/templates/verification-report-template.md
      - docs/templates/spec-drift-report-template.md
      - docs/templates/closeout-report-template.md

  docs/templates/work-block-template.md:
    role: portable_work_block_contract
    status: normative
    owner: orchestrator
    update_when:
      - scope risk capability or gate fields change
      - closeout evidence requirements change
    related:
      - governance/artifacts.md
      - .agent/workflows/sdd-protocol.md

  docs/templates/verification-report-template.md:
    role: verification_report_contract
    status: normative
    owner: verifier
    update_when:
      - verification evidence or verdict schema changes
    related:
      - .agent/verification-gate.md
      - docs/templates/closeout-report-template.md

  docs/templates/spec-drift-report-template.md:
    role: specification_drift_report_contract
    status: normative
    owner: reviewer
    update_when:
      - drift classifications or gate semantics change
    related:
      - .agent/workflows/sdd-protocol.md
      - .agent/skills/spec-drift-audit/SKILL.md

  docs/templates/closeout-report-template.md:
    role: closeout_report_contract
    status: normative
    owner: orchestrator
    update_when:
      - success or reporting-only semantics change
    related:
      - docs/reports/**
      - .agent/workflows/sdd-protocol.md

  docs/engineering-memory/**:
    role: durable_engineering_memory
    status: durable_reference
    owner: architect
    update_when:
      - reusable evidence-backed decision is promoted
      - source-of-truth chain or reproducibility procedure changes
      - temporary exception is added reviewed or retired
    related:
      - docs/specs/**
      - docs/architecture/**
      - memory_bank/decisions.md

  docs/session-bootstrap.md:
    role: new_session_intake_guidance
    status: normative
    owner: architect
    update_when:
      - progressive read strategy changes
      - repository preflight changes
    related:
      - AGENTS.md
      - PROJECT_MAP.md
      - FILE_REGISTRY.yml

  runtimes/**:
    role: runtime_capability_and_fallback_adapters
    status: runtime_adapter
    owner: architect
    update_when:
      - runtime capabilities or limitations are verified
      - adapter mapping or fallback changes
    related:
      - governance/runtime-capabilities.md
      - .codex/**
      - .claude/**

  .codex/**:
    role: codex_project_runtime_configuration
    status: runtime_adapter
    owner: orchestrator
    update_when:
      - Codex agents hooks gates or MCP configuration change
    related:
      - runtimes/codex/README.md
      - AGENTS.md

  .claude/**:
    role: claude_code_project_runtime_configuration
    status: runtime_adapter
    owner: architect
    update_when:
      - Claude Code agents hooks skills settings or memory policy change
    related:
      - runtimes/claude-code/README.md
      - CLAUDE.md
      - .mcp.json

  .mcp.json:
    role: project_mcp_integration_configuration
    status: integration_adapter
    owner: owner
    update_when:
      - approved MCP servers or tool boundaries change
    related:
      - runtimes/**
      - AGENTS.md

  memory_bank/context.md:
    role: current_operational_context
    status: operational_log
    owner: orchestrator
    update_when:
      - active objective or next gate changes
    related:
      - memory_bank/progress.md
      - docs/engineering-memory/**

  memory_bank/progress.md:
    role: rolling_execution_progress
    status: operational_log
    owner: orchestrator
    update_when:
      - stage or Work Block progress changes
    related:
      - docs/plans/**
      - memory_bank/context.md

  memory_bank/decisions.md:
    role: operational_decisions_pending_promotion
    status: operational_log
    owner: orchestrator
    update_when:
      - temporary execution decision is made
    related:
      - docs/engineering-memory/**

  memory_bank/orchestrator-log.md:
    role: orchestration_audit_log
    status: operational_log
    owner: orchestrator
    update_when:
      - significant routing gate or fallback decision occurs
    related:
      - docs/plans/**
      - memory_bank/review-log.md

  memory_bank/review-log.md:
    role: assurance_finding_log
    status: operational_log
    owner: reviewer
    update_when:
      - Critic Reviewer Verifier or Drift Auditor produces findings
    related:
      - docs/reports/**
      - .agent/critic-gate.md
      - .agent/verification-gate.md

  memory_bank/external-team-log.md:
    role: external_runtime_or_team_delivery_log
    status: operational_log
    owner: orchestrator
    update_when:
      - work is delegated across runtime process or machine boundaries
    related:
      - runtimes/**
      - handoff/**

  scripts/bootstrap.sh:
    role: generated_project_health_check
    status: normative
    owner: verifier
    update_when:
      - required governance workflow or adapter paths change
    related:
      - AGENTS.md
      - governance/**
      - PROJECT_MAP.md

  source_directories:
    role: project_source_and_tests
    status: source
    owner: coder
    patterns:
      - "{{SOURCE_DIRS}}"
    update_when:
      - approved Work Block includes the path in its write-set
    related:
      - docs/specs/**
      - docs/plans/**

  generated_outputs:
    role: build_cache_and_discovery_artifacts
    status: generated
    owner: tooling
    patterns:
      - node_modules/**
      - .next/**
      - dist/**
      - build/**
      - coverage/**
      - graphify-out/**
    update_when:
      - generated by approved tools
    related:
      - .gitignore

  local_secrets:
    role: credentials_private_environment_and_runtime_state
    status: local_state
    owner: owner
    patterns:
      - .env
      - .env.*
      - "*.pem"
      - "*.key"
      - secrets/**
      - credentials/**
    update_when:
      - never commit; manage through approved secret process
    related:
      - .gitignore
