# Machine-readable navigation registry for authority-bearing files and major zones.
# Register contracts and repository areas, not every file.

version: 3
scope: generated_project
project:
  name: "{{PROJECT_NAME}}"
  slug: "{{PROJECT_SLUG}}"
  root: "{{PROJECT_ROOT}}"

statuses:
  normative: "governance, product, architecture, or policy source of truth"
  derived: "artifact derived from approved normative intent"
  evidence: "critic, review, verification, drift, integration, or closeout evidence"
  runtime_adapter: "runtime-specific execution configuration or guidance"
  integration_adapter: "optional plugin, MCP, external runtime, tool, or transport"
  durable_reference: "evidence-backed engineering memory"
  operational_log: "current or historical execution state; not normative"
  generated: "tool-generated artifact; verify against current source"
  local_state: "machine-local, private, credential, cache, or runtime state"
  source: "project implementation or tests"

authority_order:
  product_and_delivery:
    - explicit_owner_instruction_or_approved_change_request
    - approved_specification
    - accepted_architecture_decisions_and_external_contracts
    - approved_implementation_plan
    - active_tasklist
    - assurance_and_closeout_reports
    - durable_engineering_memory
    - runtime_integration_operational_logs
    - generated_and_external_reference_artifacts
  agent_behavior:
    - explicit_owner_instruction
    - AGENTS.md
    - governance_core
    - active_work_block_scope_and_write_set
    - canonical_sdlc_protocol
    - runtime_adapters
    - admitted_integration_adapters
    - operational_logs_and_generated_artifacts

entries:
  AGENTS.md:
    role: project_operating_contract
    status: normative
    owner: owner
    related: [governance/README.md, .agent/workflows/sdd-protocol.md, .agent/ROSTER.md]

  governance/**:
    role: runtime_neutral_governance_core
    status: normative
    owner: architect
    related: [AGENTS.md, runtimes/**, integrations/**, docs/templates/work-block-template.md]

  PROJECT_MAP.md:
    role: human_readable_project_map
    status: normative
    owner: architect
    related: [FILE_REGISTRY.yml, docs/session-bootstrap.md]

  FILE_REGISTRY.yml:
    role: machine_readable_navigation_registry
    status: normative
    owner: architect
    related: [PROJECT_MAP.md, docs/session-bootstrap.md]

  .agent/ROSTER.md:
    role: logical_role_and_skill_router
    status: normative
    owner: architect
    related: [AGENTS.md, .agent/workflows/sdd-protocol.md, runtimes/**]

  .agent/workflows/sdd-protocol.md:
    role: canonical_define_execute_assure_close_contract
    status: normative
    owner: architect
    related: [governance/lifecycle.md, docs/templates/work-block-template.md]

  .agent/active-work-block.json:
    role: executable_work_block_source_write_integration_assurance_gate
    status: operational_log
    owner: orchestrator
    related: [.agent/hooks/**, .claude/hooks/**, .codex/hooks/**]

  .agent/hooks/**:
    role: provider_neutral_machine_gate_implementation
    status: runtime_adapter
    owner: maintainer

  .agent/hooks/hard_stop_policy.py:
    role: consequential_action_and_external_runtime_integration_guard
    status: runtime_adapter
    owner: maintainer

  .agent/critic-gate.md:
    role: human_readable_critic_gate_compatibility_view
    status: operational_log
    owner: orchestrator
    related: [.agent/active-work-block.json]

  .agent/verification-gate.md:
    role: human_readable_assurance_gate_compatibility_view
    status: operational_log
    owner: verifier
    related: [.agent/active-work-block.json]

  .agent/skills/**:
    role: installed_portable_skills
    status: runtime_adapter
    owner: architect
    related: [.agent/ROSTER.md]

  docs/specs/**:
    role: approved_product_and_technical_specifications
    status: normative
    owner: architect
    related: [docs/plans/**, docs/tasklist/**, docs/reports/**]

  docs/architecture/**:
    role: accepted_architecture_decisions_and_contracts
    status: normative
    owner: architect
    related: [docs/specs/**, docs/engineering-memory/**]

  docs/plans/**:
    role: approved_implementation_plans_and_work_blocks
    status: derived
    owner: orchestrator
    related: [docs/specs/**, docs/templates/work-block-template.md]

  docs/tasklist/**:
    role: active_task_decomposition
    status: derived
    owner: orchestrator
    related: [docs/specs/**, docs/plans/**]

  docs/reports/**:
    role: critic_review_verification_drift_integration_and_closeout_evidence
    status: evidence
    owner: verifier

  docs/templates/work-block-template.md:
    role: portable_work_block_contract
    status: normative
    owner: orchestrator
    related: [governance/artifacts.md, .agent/workflows/sdd-protocol.md]

  docs/templates/verification-report-template.md:
    role: verification_report_contract
    status: normative
    owner: verifier

  docs/templates/spec-drift-report-template.md:
    role: specification_drift_report_contract
    status: normative
    owner: reviewer

  docs/templates/closeout-report-template.md:
    role: closeout_report_contract
    status: normative
    owner: orchestrator

  docs/templates/integration-admission-template.md:
    role: integration_admission_trust_permission_and_evidence_contract
    status: normative
    owner: owner
    related: [integrations/**, docs/mcp-tool-policy.md]

  docs/engineering-memory/**:
    role: durable_engineering_memory
    status: durable_reference
    owner: architect

  docs/session-bootstrap.md:
    role: new_session_intake_guidance
    status: normative
    owner: architect
    related: [AGENTS.md, PROJECT_MAP.md, FILE_REGISTRY.yml]

  runtimes/**:
    role: runtime_capability_and_fallback_adapters
    status: runtime_adapter
    owner: architect
    related: [governance/runtime-capabilities.md, integrations/**]

  runtimes/codex/**:
    role: codex_runtime_adapter_guidance
    status: runtime_adapter
    owner: maintainer
    related: [.codex/**]

  runtimes/claude-code/**:
    role: claude_code_runtime_adapter_guidance
    status: runtime_adapter
    owner: maintainer
    related: [.claude/**, CLAUDE.md]

  runtimes/opencode/**:
    role: opencode_runtime_adapter_guidance
    status: runtime_adapter
    owner: maintainer
    related: [opencode.json, .opencode/**]

  runtimes/generic/**:
    role: generic_sequential_runtime_fallback
    status: runtime_adapter
    owner: architect

  integrations/**:
    role: optional_external_capability_and_transport_adapters
    status: integration_adapter
    owner: architect
    related: [docs/templates/integration-admission-template.md, docs/mcp-tool-policy.md]

  integrations/claude-code-codex-plugin/**:
    role: optional_official_codex_plugin_bridge
    status: integration_adapter
    owner: maintainer

  integrations/mcp/**:
    role: optional_mcp_server_and_exact_tool_boundary
    status: integration_adapter
    owner: architect
    related: [.mcp.json]

  integrations/file-handoff/**:
    role: optional_audited_runtime_neutral_file_transport
    status: integration_adapter
    owner: architect

  .codex/**:
    role: codex_project_runtime_configuration
    status: runtime_adapter
    owner: orchestrator
    related: [runtimes/codex/README.md, AGENTS.md]

  .codex/hooks/hard_stop_policy.py:
    role: codex_wrapper_for_shared_hard_stop_policy
    status: runtime_adapter
    owner: maintainer

  CLAUDE.md:
    role: claude_code_runtime_entrypoint
    status: runtime_adapter
    owner: maintainer
    related: [AGENTS.md, runtimes/claude-code/README.md, integrations/**]

  .claude/**:
    role: claude_code_project_runtime_configuration
    status: runtime_adapter
    owner: architect
    related: [runtimes/claude-code/README.md, CLAUDE.md]

  .claude/settings.json:
    role: claude_code_logical_agents_and_machine_hook_registration
    status: runtime_adapter
    owner: maintainer

  .claude/hooks/work_block_gate.py:
    role: claude_source_write_gate_using_active_work_block
    status: runtime_adapter
    owner: maintainer

  .claude/hooks/assurance_gate.py:
    role: claude_review_verification_drift_closeout_gate
    status: runtime_adapter
    owner: maintainer

  opencode.json:
    role: opencode_project_instructions_permissions_and_inert_integrations
    status: runtime_adapter
    owner: maintainer
    related: [.opencode/agents/**, runtimes/opencode/README.md]

  .opencode/agents/**:
    role: opencode_logical_role_subagents
    status: runtime_adapter
    owner: maintainer

  .mcp.json:
    role: empty_opt_in_project_mcp_registry
    status: integration_adapter
    owner: owner
    related: [integrations/mcp/README.md, docs/mcp-tool-policy.md]

  memory_bank/context.md:
    role: current_operational_context
    status: operational_log
    owner: orchestrator

  memory_bank/progress.md:
    role: rolling_execution_progress
    status: operational_log
    owner: orchestrator

  memory_bank/decisions.md:
    role: operational_decisions_pending_promotion
    status: operational_log
    owner: orchestrator

  memory_bank/orchestrator-log.md:
    role: orchestration_audit_log
    status: operational_log
    owner: orchestrator

  memory_bank/review-log.md:
    role: assurance_finding_log
    status: operational_log
    owner: reviewer

  memory_bank/external-team-log.md:
    role: external_runtime_or_team_delivery_log
    status: operational_log
    owner: orchestrator

  scripts/bootstrap.sh:
    role: generated_project_health_check
    status: normative
    owner: verifier

  source_directories:
    role: project_source_and_tests
    status: source
    owner: coder
    patterns:
      - "{{SOURCE_DIRS}}"

  generated_outputs:
    role: build_cache_and_discovery_artifacts
    status: generated
    owner: tooling
    patterns: [node_modules/**, .next/**, dist/**, build/**, coverage/**, graphify-out/**]

  local_secrets:
    role: credentials_private_environment_and_runtime_state
    status: local_state
    owner: owner
    patterns: [.env, .env.*, "*.pem", "*.key", secrets/**, credentials/**]
