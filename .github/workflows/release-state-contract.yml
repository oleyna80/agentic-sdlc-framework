name: Release State Contract

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: write

jobs:
  terminal-patch:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/agent/post-merge-ssot-release-gate') || (github.event_name == 'pull_request' && github.head_ref == 'agent/post-merge-ssot-release-gate')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/post-merge-ssot-release-gate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Apply bounded terminal patch
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path("scripts/validate-release-state.py")
          text = validator.read_text(encoding="utf-8")

          old_pattern = '    re.compile(r"^\\s*[-*]?\\s*\\*\\*Merge status:\\*\\*", re.IGNORECASE | re.MULTILINE),'
          new_pattern = '    re.compile(r"^\\s*[-*]?\\s*(?:\\*\\*)?Merge status:(?:\\*\\*)?", re.IGNORECASE | re.MULTILINE),'
          if text.count(old_pattern) != 1:
              raise SystemExit("expected exactly one raw Merge status pattern")
          text = text.replace(old_pattern, new_pattern)

          lines = text.splitlines()
          canonical_skip = "        if relative == canonical_closeout:"
          if lines.count(canonical_skip) != 1:
              raise SystemExit("expected exactly one early canonical closeout skip")
          skip_index = lines.index(canonical_skip)
          if lines[skip_index + 1] != "            continue":
              raise SystemExit("canonical closeout skip has unexpected shape")
          del lines[skip_index:skip_index + 2]

          seen_line = "        seen[str(work_block_id)] = relative"
          if lines.count(seen_line) != 1:
              raise SystemExit("expected exactly one duplicate-tracking seed")
          seen_index = lines.index(seen_line)
          lines[seen_index + 1:seen_index + 1] = [
              "        if relative == canonical_closeout:",
              "            continue",
          ]
          validator.write_text("\n".join(lines) + "\n", encoding="utf-8")

          fixtures = Path("scripts/test-release-state-contracts.py")
          tests = fixtures.read_text(encoding="utf-8")

          old_case = '            ("mutable-merge-status-open", "- **Merge status:** open"),\n'
          new_case = old_case + '            ("mutable-merge-status-plain-open", "- Merge status: open"),\n'
          if tests.count(old_case) != 1:
              raise SystemExit("expected exactly one decorated Merge status fixture")
          tests = tests.replace(old_case, new_case)

          anchor = "        (root / OLDER_CLOSEOUT).unlink()\n\n"
          if tests.count(anchor) != 1:
              raise SystemExit("expected exactly one historical-closeout fixture anchor")
          duplicate_fixture = (
              anchor
              + "        populate(root)\n"
              + '        duplicate_closeout = "docs/reports/closeout/wb-007-duplicate.md"\n'
              + "        write(root / duplicate_closeout, closeout())\n"
              + "        expect_failure(\n"
              + '            "canonical-plus-additional-closeout",\n'
              + "            root,\n"
              + '            "multiple closeout reports",\n'
              + "        )\n"
              + "        (root / duplicate_closeout).unlink()\n\n"
          )
          fixtures.write_text(tests.replace(anchor, duplicate_fixture), encoding="utf-8")
          PY

      - name: Restore workflow and verify
        run: |
          git show 387594fa0ba7162edc54396185170d0a45e4a10f:.github/workflows/release-state-contract.yml > .github/workflows/release-state-contract.yml
          git diff --check
          python scripts/test-release-state-contracts.py
          python scripts/validate-release-state.py
          bash scripts/validate-governance.sh

      - name: Commit clean terminal patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-release-state.py scripts/test-release-state-contracts.py .github/workflows/release-state-contract.yml
          git commit -m "fix: close release-state detection gaps"
          git push origin HEAD:agent/post-merge-ssot-release-gate
