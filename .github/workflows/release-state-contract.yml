name: Release State Contract

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: write

jobs:
  patch-ninth-evidence:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/agent/post-merge-ssot-release-gate') || (github.event_name == 'pull_request' && github.head_ref == 'agent/post-merge-ssot-release-gate')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/post-merge-ssot-release-gate
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Patch and verify evidence
        shell: bash
        run: |
          set +e
          (
            python scripts/wb008-ninth-evidence.py
            python scripts/test-release-state-contracts.py
            python scripts/validate-release-state.py
            bash scripts/validate-governance.sh
          ) > /tmp/wb008-ninth-evidence.log 2>&1
          status=$?
          cat /tmp/wb008-ninth-evidence.log
          exit $status
      - name: Upload evidence diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wb008-ninth-evidence-diagnostic
          path: /tmp/wb008-ninth-evidence.log
      - name: Commit evidence
        run: |
          rm scripts/wb008-ninth-evidence.py
          git config user.name "oleyna80"
          git config user.email "209451099+oleyna80@users.noreply.github.com"
          git add docs/plans/wb-008-post-merge-ssot-release-gate.md docs/reports/reviews/pr-8-final-review.md docs/reports/drift/wb-008-post-merge-ssot-release-gate.md docs/reports/closeout/wb-008-post-merge-ssot-release-gate.md scripts/wb008-ninth-evidence.py
          git commit -m "docs: record ninth review correction"
          git push origin HEAD:agent/post-merge-ssot-release-gate

  release-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Check release-state validator syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          for relative in (
              "scripts/validate-release-state.py",
              "scripts/test-release-state-contracts.py",
          ):
              path = Path(relative)
              compile(path.read_text(encoding="utf-8"), relative, "exec")
              print(f"syntax OK: {relative}")
          PY
      - name: Run adversarial release-state fixtures
        run: python scripts/test-release-state-contracts.py
      - name: Validate repository release state
        run: python scripts/validate-release-state.py
