name: Framework Contracts

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Check shell syntax
        run: |
          bash -n bootstrap.sh
          bash -n scripts/test-sdd-contract.sh
          bash -n scripts/validate-governance.sh
          bash -n scripts/validate-publication.sh
          bash -n template/scripts/bootstrap.sh

      - name: Validate runtime-neutral SDLC contracts
        run: bash scripts/test-sdd-contract.sh

      - name: Validate governance structure
        run: bash scripts/validate-governance.sh

      - name: Validate publication scaffold
        run: bash scripts/validate-publication.sh

      - name: Bootstrap disposable generated project
        run: |
          target="$(mktemp -d)"
          ./bootstrap.sh "$target" "Contract Smoke" contract-smoke
          test -f "$target/AGENTS.md"
          test -f "$target/governance/authority.md"
          test -f "$target/governance/lifecycle.md"
          test -f "$target/runtimes/codex/README.md"
          test -f "$target/runtimes/generic/README.md"
          test -f "$target/.agent/skills/spec-drift-audit/SKILL.md"
          test -f "$target/docs/templates/spec-drift-report-template.md"
          grep -q "Contract Smoke" "$target/AGENTS.md"
          grep -q "contract-smoke" "$target/FILE_REGISTRY.yml"
          rm -rf "$target"
