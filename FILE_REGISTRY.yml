# Machine-readable navigation registry for authority-bearing files and major
# repository zones. Register contracts and boundaries, not every file.

version: 4
scope: framework_repository
architecture: runtime_neutral_control_plane

statuses:
  normative: "source of truth or accepted policy-bearing file"
  template: "copied into generated projects"
  runtime_adapter: "runtime-specific implementation; cannot override governance"
  integration_adapter: "plugin, MCP, handoff, or transport; cannot override governance"
  reference: "background knowledge; does not override policy"
  evidence: "review, verification, drift, CI, or closeout evidence"
  log: "active or historical Work Block state; not general policy"
  example: "illustrative scenario; never mandatory policy"
  generated: "derived output; verify against current source"
  local_state: "machine-local or private state; do not publish by default"

artifact_authority_order:
  - explicit_owner_instruction_for_active_work_block
  - active_workspace_AGENTS_and_governance
  - approved_specification_and_acceptance_criteria
  - accepted_architecture_decisions_and_external_contracts
  - approved_implementation_plan_and_write_set
  - active_task_decomposition
  - review_verification_drift_and_closeout_evidence
  - durable_engineering_memory
  - runtime_policy_operational_logs_generated_context_and_examples

role_dimensions:
  authority_roles: [owner, orchestrator, architect, critic, coder, reviewer, verifier]
  separate_from_authority:
    - runtime
    - model_class
    - actual_model
    - specialization
    - isolation_level
    - tool_availability

migration_state:
  completed_work_blocks:
    - docs/plans/wb-001-runtime-neutral-control-plane.md
    - docs/plans/wb-002-runtime-neutral-template-convergence.md
    - docs/plans/wb-003-codex-native-agents-and-gates.md
  active_work_block: null
  planned:
    - WB-004 integration adapter normalization
    - WB-005 profile-aware bootstrap and cross-runtime conformance

entries:
  governance/**:
    role: runtime_neutral_governance_core
    status: normative
    owner: architect
    related: [governance/README.md, runtimes/**]

  governance/README.md:
    role: governance_entrypoint
    status: normative
    owner: architect

  governance/authority.md:
    role: logical_roles_and_authority_boundaries
    status: normative
    owner: owner

  governance/lifecycle.md:
    role: runtime_neutral_lifecycle_contract
    status: normative
    owner: architect

  governance/artifacts.md:
    role: portable_artifact_and_ssot_contract
    status: normative
    owner: architect

  governance/runtime-capabilities.md:
    role: runtime_capability_negotiation
    status: normative
    owner: architect

  runtimes/**:
    role: runtime_adapter_collection
    status: runtime_adapter
    owner: maintainer
    related: [governance/runtime-capabilities.md, governance/authority.md]

  runtimes/codex/**:
    role: codex_runtime_adapter
    status: runtime_adapter
    owner: maintainer
    related:
      - template/.codex/**
      - template/.agent/active-work-block.json
      - scripts/test-codex-adapter.py

  runtimes/claude-code/**:
    role: claude_code_runtime_adapter
    status: runtime_adapter
    owner: maintainer
    related: [template/.claude/**, template/CLAUDE.md]

  runtimes/opencode/**:
    role: opencode_runtime_adapter
    status: runtime_adapter
    owner: maintainer
    related: [framework/knowledge/opencode-runtime.md]

  runtimes/generic/**:
    role: generic_sequential_agent_baseline
    status: runtime_adapter
    owner: architect

  docs/architecture/decisions/**:
    role: accepted_architecture_decisions
    status: normative
    owner: architect

  docs/architecture/decisions/2026-07-25-runtime-neutral-control-plane.md:
    role: runtime_neutral_control_plane_adr
    status: normative
    owner: owner
    related:
      - docs/plans/wb-001-runtime-neutral-control-plane.md
      - docs/plans/wb-002-runtime-neutral-template-convergence.md
      - docs/plans/wb-003-codex-native-agents-and-gates.md
      - governance/**
      - runtimes/**

  docs/plans/**:
    role: work_block_plans_and_execution_evidence
    status: log
    owner: orchestrator

  docs/plans/wb-001-runtime-neutral-control-plane.md:
    role: completed_architecture_foundation_work_block
    status: log
    owner: orchestrator

  docs/plans/wb-002-runtime-neutral-template-convergence.md:
    role: completed_portable_contract_migration_work_block
    status: log
    owner: orchestrator

  docs/plans/wb-002-normalize-portable-sdlc-contracts.md:
    role: superseded_work_block_compatibility_alias
    status: reference
    owner: orchestrator
    related: [docs/plans/wb-002-runtime-neutral-template-convergence.md]

  docs/plans/wb-003-codex-native-agents-and-gates.md:
    role: completed_codex_native_adapter_work_block
    status: log
    owner: orchestrator
    related:
      - runtimes/codex/README.md
      - template/.codex/**
      - template/.agent/active-work-block.json
      - scripts/test-codex-adapter.py
      - .github/workflows/framework-contracts.yml

  README.md:
    role: public_entrypoint
    status: normative
    owner: maintainer

  PROJECT_MAP.md:
    role: human_readable_repository_map
    status: normative
    owner: architect
    related: [FILE_REGISTRY.yml, governance/README.md]

  FILE_REGISTRY.yml:
    role: machine_readable_navigation_registry
    status: normative
    owner: architect

  SETUP.md:
    role: setup_guide
    status: normative
    owner: maintainer

  docs/profiles.md:
    role: governance_runtime_integration_and_model_profile_selector
    status: normative
    owner: architect

  docs/session-bootstrap.md:
    role: framework_repository_progressive_intake
    status: normative
    owner: architect

  docs/mcp-tool-policy.md:
    role: tool_and_integration_authority_policy
    status: normative
    owner: architect

  bootstrap.sh:
    role: project_scaffold_installer
    status: normative
    owner: maintainer
    related: [template/**, governance/**, runtimes/**]

  scripts/test-sdd-contract.sh:
    role: portable_sdlc_contract_test
    status: normative
    owner: verifier

  scripts/test-codex-adapter.py:
    role: codex_agent_hook_and_gate_fixture_test
    status: normative
    owner: verifier

  scripts/validate-governance.sh:
    role: governance_structure_validation
    status: normative
    owner: verifier

  scripts/validate-publication.sh:
    role: publication_safety_and_scaffold_validation
    status: normative
    owner: verifier

  .github/workflows/framework-contracts.yml:
    role: framework_contract_adapter_and_bootstrap_ci
    status: evidence
    owner: verifier

  template/AGENTS.md:
    role: generated_project_runtime_neutral_operating_contract
    status: template
    owner: owner

  template/PROJECT_MAP.md:
    role: generated_project_human_navigation
    status: template
    owner: architect

  template/FILE_REGISTRY.yml:
    role: generated_project_machine_registry
    status: template
    owner: architect

  template/.agent/ROSTER.md:
    role: generated_project_logical_role_and_skill_router
    status: template
    owner: architect

  template/.agent/workflows/sdd-protocol.md:
    role: generated_project_define_execute_assure_close_contract
    status: template
    owner: architect

  template/.agent/active-work-block.json:
    role: generated_project_machine_readable_work_block_gate
    status: template
    owner: orchestrator
    related:
      - template/.codex/hooks/pre_tool_use_policy.py
      - template/.codex/hooks/subagent_context.py

  template/docs/session-bootstrap.md:
    role: generated_project_progressive_session_intake
    status: template
    owner: architect

  template/docs/templates/work-block-template.md:
    role: generated_project_portable_work_block_contract
    status: template
    owner: orchestrator

  template/docs/templates/spec-drift-report-template.md:
    role: generated_project_specification_drift_report
    status: template
    owner: reviewer

  template/scripts/bootstrap.sh:
    role: generated_project_health_check
    status: template
    owner: verifier

  template/.codex/config.toml.template:
    role: codex_project_configuration_template
    status: runtime_adapter
    owner: maintainer

  template/.codex/agents/**:
    role: codex_project_scoped_logical_role_agents
    status: runtime_adapter
    owner: maintainer

  template/.codex/hooks.json:
    role: codex_project_hook_registration
    status: runtime_adapter
    owner: maintainer

  template/.codex/hooks/pre_tool_use_policy.py:
    role: codex_fail_closed_write_and_hard_stop_guard
    status: runtime_adapter
    owner: maintainer

  template/.codex/hooks/subagent_context.py:
    role: codex_bounded_subagent_work_block_context
    status: runtime_adapter
    owner: maintainer

  template/.codex/write-gate.md:
    role: codex_human_readable_gate_compatibility_view
    status: runtime_adapter
    owner: maintainer

  template/.codex/**:
    role: codex_runtime_adapter_implementation
    status: runtime_adapter
    owner: maintainer

  template/.claude/**:
    role: current_claude_code_runtime_compatibility_layer
    status: runtime_adapter
    owner: maintainer

  skills/catalog.yml:
    role: shared_skill_library_navigation_index
    status: normative
    owner: architect

  skills/spec-drift-audit/**:
    role: portable_specification_alignment_assurance
    status: normative
    owner: reviewer

  skills/**:
    role: portable_skill_library
    status: normative
    owner: maintainer

  handoff/**:
    role: audited_file_based_cross_runtime_transport
    status: integration_adapter
    owner: architect

  framework/**:
    role: reference_knowledge
    status: reference
    owner: maintainer

  examples/**:
    role: scenario_guides
    status: example
    owner: docs

  archive/**:
    role: private_or_local_archive
    status: local_state
    owner: owner

  graphify-out/**:
    role: generated_discovery_graph
    status: generated
    owner: tooling
