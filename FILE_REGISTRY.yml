# Machine-readable navigation registry for authority-bearing files and major
# repository zones. Register contracts, canonical classes, and boundaries, not
# mutable assurance results or every file.

version: 20
scope: framework_repository
architecture: runtime_neutral_control_plane

statuses:
  normative: "source of truth or accepted policy-bearing file"
  proposed: "target policy or architecture awaiting accepted status"
  accepted: "Owner-approved normative target contract; may remain unimplemented or unpromoted"
  template: "copied into generated projects"
  runtime_adapter: "runtime-specific implementation; cannot override governance"
  integration_adapter: "plugin, MCP, external runtime, tool, or transport boundary"
  installation_manifest: "scaffold composition data; grants no authority"
  reference: "background knowledge; does not override policy"
  evidence: "self-contained assurance or closeout evidence; grants no authority by indexing"
  log: "active or historical Work Block state; not general policy"
  example: "illustrative scenario; never mandatory policy"
  generated: "derived output; verify against current source"
  local_state: "machine-local or private state; do not publish by default"

artifact_authority_order:
  - explicit_owner_instruction_and_recorded_approval_or_revocation
  - root_AGENTS_and_accepted_governance
  - approved_specification_and_accepted_architecture_decisions
  - active_work_block
  - approved_implementation_and_evaluation_plans_and_tasklists
  - mission_brief_or_active_task_decomposition
  - frozen_implementation_diff_or_final_artifact
  - review_verification_evaluation_drift_release_state_integration_and_closeout_evidence
  - durable_engineering_memory
  - runtime_integration_operational_logs_generated_context_caches_and_external_references

role_dimensions:
  authority_roles: [owner, orchestrator, architect, critic, coder, reviewer, verifier]
  specializations: [evaluator, drift_auditor, security_reviewer, domain_verifier]
  separate_from_authority:
    - installation_profile
    - runtime
    - model_class
    - actual_model
    - specialization
    - isolation_level
    - tool_availability
    - integration
    - provider
    - hosting_platform_state

assurance_contract:
  normative_subject: exact_commit_or_artifact_revision
  normative_subject_includes:
    - specification
    - architecture_decisions
    - active_work_block
    - authoritative_plans_and_tasks
    - normative_navigation_and_registry_content
    - delivered_artifact
    - proposed_to_accepted_status_changes
  normative_navigation_content:
    - authority_order
    - operational_and_target_architecture
    - canonical_path_ownership
    - active_lifecycle_state
    - accepted_or_proposed_authority_status
  mutable_assurance_mirrors: prohibited
  per_report_registration_required: false
  report_discovery: canonical_directory_and_structured_frontmatter
  evidence_history_source: report_artifacts
  indexing_grants_authority: false
  static_evidence_classes:
    - docs/reports/reviews/**
    - docs/reports/verification/**
    - docs/reports/evaluations/**
    - docs/reports/closeout/**
  evidence_only_commit:
    allowed_paths: approved_assurance_or_closeout_reports_only
    changes_normative_subject: false
    may_follow_verified_subject: true
    requires_green_ci_on_resulting_pr_head: true
    hidden_normative_changes: forbidden
    navigation_update_required: false
  verdicts:
    critic: [APPROVE, APPROVE_WITH_CHANGES, RECONSIDER, BLOCKED]
    reviewer: [READY, CHANGES_REQUIRED, BLOCKED, UNVERIFIED]
    verifier: [READY, NOT_READY, BLOCKED, UNVERIFIED]
  readiness_invalidation: any_applicable_normative_subject_change
  report_inside_verified_commit_required: false
  acceptance_sequence:
    - preliminary_reviewer_and_verifier_assurance
    - owner_authorizes_accepted_status_finalization
    - status_only_normative_commit
    - final_applicable_assurance_against_normative_subject
    - evidence_only_report_commit
    - ci_on_resulting_pr_head
    - separate_owner_merge_approval

installation_profiles:
  source: bootstrap/profiles.json
  engine: bootstrap/bootstrap_project.py
  default: multi-runtime
  canonical: [core, codex, claude-code, opencode, multi-runtime]
  aliases:
    minimal: core
    generic: core
    full: multi-runtime
  generated_state: .agent/bootstrap-profile.json
  authority: none
  rules:
    - validate_before_target_mutation
    - required_paths_validate_expected_filesystem_kind
    - blocked_default_work_block_validates_before_restore
    - evaluation_contract_available_in_every_profile
    - selected_runtime_surfaces_only
    - no_automatic_integration_activation
    - no_credentials_or_provider_binding
    - work_block_authority_remains_separate
    - external_skill_adaptation_requires_owner_approved_write_set

evaluation_assurance:
  contract: governance/evaluation.md
  plan_template: template/docs/templates/evaluation-plan-template.json
  report_template: template/docs/templates/evaluation-report-template.json
  event_template: template/docs/templates/trajectory-event-template.json
  generated_validator: template/scripts/validate-evaluation.py
  contract_fixtures: scripts/test-evaluation-contracts.py
  publication_validator: scripts/validate_evaluation_publication.py
  evidence_boundary: observable_events_only
  hidden_reasoning_required: false
  authority: none

repair_assurance:
  mode: controlled_ndr_only
  repair_record_template: template/docs/templates/repair-record-template.md
  combined_assurance_template: template/docs/templates/combined-assurance-report-template.md
  validator: template/scripts/repair-lifecycle.py
  provider_snapshot: ci_artifact_only
  authority: none

skill_library_maintenance:
  skill: skills/skill-library-maintenance/SKILL.md
  priority_sources: skills/skill-library-maintenance/reference/priority-sources.md
  ecosystem_watchlist: skills/skill-library-maintenance/reference/ecosystem-watchlist.md
  provenance_schema: skills/skill-library-maintenance/reference/provenance-record.md
  discovery_mode: read_only
  revision_binding: full_commit_sha
  missing_evidence: blocked
  adaptation_gate: owner_approved_exact_write_set
  external_content_trust: untrusted
  authority: none

