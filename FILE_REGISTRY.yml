# Machine-readable navigation registry for authority-bearing files and major
# repository zones. Register contracts and boundaries, not every file.

version: 6
scope: framework_repository
architecture: runtime_neutral_control_plane

statuses:
  normative: "source of truth or accepted policy-bearing file"
  template: "copied into generated projects"
  runtime_adapter: "runtime-specific implementation; cannot override governance"
  integration_adapter: "plugin, MCP, external runtime, tool, or transport boundary"
  reference: "background knowledge; does not override policy"
  evidence: "review, verification, drift, CI, or closeout evidence"
  log: "active or historical Work Block state; not general policy"
  example: "illustrative scenario; never mandatory policy"
  generated: "derived output; verify against current source"
  local_state: "machine-local or private state; do not publish by default"

artifact_authority_order:
  - explicit_owner_instruction_for_active_work_block
  - active_workspace_AGENTS_and_governance
  - approved_specification_and_acceptance_criteria
  - accepted_architecture_decisions_and_external_contracts
  - approved_implementation_plan_and_write_set
  - active_task_decomposition
  - review_verification_drift_and_closeout_evidence
  - durable_engineering_memory
  - runtime_integration_operational_logs_generated_context_and_examples

role_dimensions:
  authority_roles: [owner, orchestrator, architect, critic, coder, reviewer, verifier]
  separate_from_authority:
    - runtime
    - model_class
    - actual_model
    - specialization
    - isolation_level
    - tool_availability
    - integration
    - provider

migration_state:
  completed_work_blocks:
    - docs/plans/wb-001-runtime-neutral-control-plane.md
    - docs/plans/wb-002-runtime-neutral-template-convergence.md
    - docs/plans/wb-003-codex-native-agents-and-gates.md
  active_work_block: docs/plans/wb-004-integration-adapter-normalization.md
  planned:
    - WB-005 profile-aware bootstrap and cross-runtime conformance

entries:
  governance/**:
    role: runtime_neutral_governance_core
    status: normative
    owner: architect
    related: [governance/README.md, runtimes/**, integrations/**]

  governance/README.md:
    role: governance_entrypoint
    status: normative
    owner: architect

  governance/authority.md:
    role: logical_roles_and_authority_boundaries
    status: normative
    owner: owner

  governance/lifecycle.md:
    role: runtime_neutral_lifecycle_contract
    status: normative
    owner: architect

  governance/artifacts.md:
    role: portable_artifact_and_ssot_contract
    status: normative
    owner: architect

  governance/runtime-capabilities.md:
    role: runtime_capability_negotiation
    status: normative
    owner: architect

  runtimes/**:
    role: runtime_adapter_collection
    status: runtime_adapter
    owner: maintainer
    related: [governance/runtime-capabilities.md, governance/authority.md, integrations/**]

  runtimes/codex/**:
    role: codex_runtime_adapter
    status: runtime_adapter
    owner: maintainer
    related: [template/.codex/**, template/.agent/active-work-block.json]

  runtimes/claude-code/**:
    role: claude_code_runtime_adapter
    status: runtime_adapter
    owner: maintainer
    related: [template/.claude/**, template/CLAUDE.md, integrations/**]

  runtimes/opencode/**:
    role: opencode_runtime_adapter
    status: runtime_adapter
    owner: maintainer
    related: [template/opencode.json, template/.opencode/**]

  runtimes/generic/**:
    role: generic_sequential_agent_baseline
    status: runtime_adapter
    owner: architect

  integrations/**:
    role: optional_external_capability_and_transport_adapters
    status: integration_adapter
    owner: architect
    related: [docs/mcp-tool-policy.md, template/docs/templates/integration-admission-template.md]

  integrations/README.md:
    role: integration_admission_and_selection_entrypoint
    status: normative
    owner: architect

  integrations/claude-code-codex-plugin/**:
    role: official_codex_plugin_for_claude_code_adapter
    status: integration_adapter
    owner: maintainer

  integrations/mcp/**:
    role: mcp_server_and_exact_tool_admission_adapter
    status: integration_adapter
    owner: architect
    related: [template/.mcp.json, docs/mcp-tool-policy.md]

  integrations/file-handoff/**:
    role: runtime_neutral_audited_file_transport_contract
    status: integration_adapter
    owner: architect
    related: [handoff/**, handoff/templates/runtime-task-template.md]

  docs/architecture/decisions/**:
    role: accepted_architecture_decisions
    status: normative
    owner: architect

  docs/architecture/decisions/2026-07-25-runtime-neutral-control-plane.md:
    role: runtime_neutral_control_plane_adr
    status: normative
    owner: owner

  docs/plans/**:
    role: work_block_plans_and_execution_evidence
    status: log
    owner: orchestrator

  docs/plans/wb-001-runtime-neutral-control-plane.md:
    role: completed_architecture_foundation_work_block
    status: log
    owner: orchestrator

  docs/plans/wb-002-runtime-neutral-template-convergence.md:
    role: completed_portable_contract_migration_work_block
    status: log
    owner: orchestrator

  docs/plans/wb-002-normalize-portable-sdlc-contracts.md:
    role: superseded_work_block_compatibility_alias
    status: reference
    owner: orchestrator

  docs/plans/wb-003-codex-native-agents-and-gates.md:
    role: completed_codex_native_adapter_work_block
    status: log
    owner: orchestrator

  docs/plans/wb-004-integration-adapter-normalization.md:
    role: active_integration_adapter_normalization_work_block
    status: log
    owner: orchestrator
    related: [integrations/**, runtimes/claude-code/**, runtimes/opencode/**, handoff/**]

  docs/reports/**:
    role: assurance_and_closeout_evidence
    status: evidence
    owner: verifier

  README.md:
    role: public_entrypoint
    status: normative
    owner: maintainer

  SETUP.md:
    role: setup_guide
    status: normative
    owner: maintainer

  PROJECT_MAP.md:
    role: human_readable_repository_map
    status: normative
    owner: architect
    related: [FILE_REGISTRY.yml, governance/README.md]

  FILE_REGISTRY.yml:
    role: machine_readable_navigation_registry
    status: normative
    owner: architect

  docs/profiles.md:
    role: governance_runtime_integration_and_model_profile_selector
    status: normative
    owner: architect

  docs/session-bootstrap.md:
    role: framework_repository_progressive_intake
    status: normative
    owner: architect

  docs/mcp-tool-policy.md:
    role: external_tool_and_integration_authority_policy
    status: normative
    owner: architect

  bootstrap.sh:
    role: project_scaffold_installer
    status: normative
    owner: maintainer
    related: [template/**, governance/**, runtimes/**, integrations/**]

  scripts/test-sdd-contract.sh:
    role: portable_sdlc_contract_test
    status: normative
    owner: verifier

  scripts/test-integration-contracts.py:
    role: runtime_integration_static_and_executable_fixture_test
    status: normative
    owner: verifier

  scripts/test-codex-adapter.py:
    role: codex_agent_hook_and_gate_fixture_test
    status: normative
    owner: verifier

  scripts/test-codex-hard-stops.py:
    role: consequential_operation_and_approval_fixture_test
    status: normative
    owner: verifier

  scripts/validate-governance.sh:
    role: governance_structure_validation
    status: normative
    owner: verifier

  scripts/validate-publication.sh:
    role: publication_safety_configuration_and_scaffold_validation
    status: normative
    owner: verifier

  .github/workflows/framework-contracts.yml:
    role: framework_contract_adapter_and_bootstrap_ci
    status: evidence
    owner: verifier

  template/AGENTS.md:
    role: generated_project_runtime_neutral_operating_contract
    status: template
    owner: owner

  template/CLAUDE.md:
    role: generated_project_claude_code_runtime_entrypoint
    status: runtime_adapter
    owner: maintainer

  template/PROJECT_MAP.md:
    role: generated_project_human_navigation
    status: template
    owner: architect

  template/FILE_REGISTRY.yml:
    role: generated_project_machine_registry
    status: template
    owner: architect

  template/.agent/ROSTER.md:
    role: generated_project_logical_role_and_skill_router
    status: template
    owner: architect

  template/.agent/workflows/sdd-protocol.md:
