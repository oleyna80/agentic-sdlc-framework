# Machine-readable navigation registry for authority-bearing files and major
# repository zones. It is intentionally selective: do not register every file.

version: 2
scope: framework_repository
architecture: runtime_neutral_control_plane

statuses:
  normative: "source of truth or policy-bearing file"
  normative_target: "accepted target architecture being migrated into templates"
  runtime_adapter: "runtime-specific implementation; cannot override governance"
  integration_adapter: "transport or integration mechanism; cannot override governance"
  template: "copied into generated projects"
  reference: "background knowledge; does not override policy"
  example: "illustrative scenario; not mandatory policy"
  log: "evidence/history; not current authority"
  derived: "generated or discovered from other sources"
  local_state: "machine-local or runtime state; do not publish by default"

artifact_authority_order:
  - explicit_owner_instruction_for_active_work_block
  - active_workspace_AGENTS_and_approved_governance
  - approved_specification_and_acceptance_criteria
  - accepted_architecture_decisions_and_external_contracts
  - approved_implementation_plan_and_write_set
  - active_task_decomposition
  - review_verification_drift_and_closeout_evidence
  - durable_engineering_memory
  - operational_memory_runtime_logs_generated_context_and_examples

role_dimensions:
  authority_roles:
    - owner
    - orchestrator
    - architect
    - critic
    - coder
    - reviewer
    - verifier
  separate_from_authority:
    - runtime
    - model
    - specialization
    - isolation_level
    - tool_availability

entries:
  governance/**:
    role: runtime_neutral_governance_core
    status: normative_target
    owner: architect
    update_when:
      - authority or logical roles change
      - lifecycle or closeout semantics change
      - artifact or SSOT rules change
      - capability negotiation or fallback rules change
    related:
      - governance/README.md
      - docs/architecture/decisions/2026-07-25-runtime-neutral-control-plane.md
      - runtimes/**

  governance/README.md:
    role: governance_entrypoint
    status: normative_target
    owner: architect
    related:
      - governance/authority.md
      - governance/lifecycle.md
      - governance/artifacts.md
      - governance/runtime-capabilities.md

  governance/authority.md:
    role: logical_roles_and_authority_boundaries
    status: normative_target
    owner: owner
    update_when:
      - an authority-bearing role changes
      - hard stops change
      - parallel write or isolation rules change

  governance/lifecycle.md:
    role: runtime_neutral_lifecycle_contract
    status: normative_target
    owner: architect
    update_when:
      - Define Execute Assure Close semantics change
      - governance profile semantics change
      - degraded or failure paths change

  governance/artifacts.md:
    role: portable_artifact_and_ssot_contract
    status: normative_target
    owner: architect
    update_when:
      - artifact metadata or verdict schemas change
      - source-of-truth order changes
      - review verification drift or closeout contracts change

  governance/runtime-capabilities.md:
    role: runtime_capability_negotiation
    status: normative_target
    owner: architect
    update_when:
      - capability schema changes
      - fallback ladder changes
      - runtime smoke-test requirements change

  runtimes/**:
    role: runtime_adapter_collection
    status: runtime_adapter
    owner: maintainer
    update_when:
      - a runtime is added or retired
      - role mappings change
      - verified capabilities or limitations change
      - runtime versions invalidate smoke evidence
    related:
      - governance/runtime-capabilities.md
      - governance/authority.md

  runtimes/codex/**:
    role: codex_runtime_adapter
    status: runtime_adapter
    owner: maintainer
    related:
      - template/.codex/**
      - framework/workflow/codex-model-routing.md

  runtimes/claude-code/**:
    role: claude_code_runtime_adapter
    status: runtime_adapter
    owner: maintainer
    related:
      - template/.claude/**
      - template/CLAUDE.md

  runtimes/opencode/**:
    role: opencode_runtime_adapter
    status: runtime_adapter
    owner: maintainer
    related:
      - framework/knowledge/opencode-runtime.md

  runtimes/generic/**:
    role: generic_sequential_agent_baseline
    status: runtime_adapter
    owner: architect

  docs/architecture/decisions/**:
    role: accepted_architecture_decisions
    status: normative
    owner: architect
    update_when:
      - a cross-cutting architecture decision is accepted superseded or retired

  docs/architecture/decisions/2026-07-25-runtime-neutral-control-plane.md:
    role: runtime_neutral_control_plane_adr
    status: normative
    owner: owner
    related:
      - docs/plans/wb-001-runtime-neutral-control-plane.md
      - governance/**
      - runtimes/**

  docs/plans/**:
    role: work_block_plans_and_execution_evidence
    status: log
    owner: orchestrator
    update_when:
      - a Work Block is created updated or closed

  docs/plans/wb-001-runtime-neutral-control-plane.md:
    role: active_runtime_neutral_migration_work_block
    status: log
    owner: orchestrator

  README.md:
    role: public_entrypoint
    status: normative
    owner: maintainer
    update_when:
      - public positioning changes
      - architecture layers or onboarding paths change
    related:
      - governance/README.md
      - PROJECT_MAP.md
      - SETUP.md

  PROJECT_MAP.md:
    role: human_readable_repository_map
    status: normative
    owner: architect
    update_when:
      - top-level directories change
      - authority or architecture layers change
      - runtime or integration adapters change
      - generated reference log or local boundaries change
    related:
      - FILE_REGISTRY.yml
      - governance/README.md

  FILE_REGISTRY.yml:
    role: machine_readable_navigation_registry
    status: normative
    owner: architect
    update_when:
      - key files or path patterns change
      - authority status changes
      - update triggers or architecture classification changes

  SETUP.md:
    role: setup_guide
    status: normative
    owner: maintainer
    update_when:
      - bootstrap flow changes
      - runtime setup changes
      - required tools change
    related:
      - README.md
      - docs/profiles.md

  bootstrap.sh:
    role: project_scaffold_installer
    status: normative
    owner: maintainer
    update_when:
      - template copy behavior changes
      - profiles affect installed content
      - generated project validation changes
    related:
      - template/**
      - scripts/validate-publication.sh

  scripts/validate-publication.sh:
    role: publication_safety_check
    status: normative
    owner: verifier
    update_when:
      - required public files change
      - publication scans change
      - bootstrap smoke expectations change

  docs/session-bootstrap.md:
    role: new_session_intake_flow
    status: normative
    owner: architect
    update_when:
      - read order or impact checks change
      - progressive disclosure rules change
      - memory usage policy changes

  docs/profiles.md:
    role: existing_operating_profile_selector
    status: normative
    owner: architect
    update_when:
      - governance profiles replace runtime-named profiles
      - onboarding or runtime layers change
    related:
      - governance/lifecycle.md
      - runtimes/**

  docs/mcp-tool-policy.md:
    role: tool_authority_policy
    status: normative
    owner: architect
    update_when:
      - MCP or external tool boundaries change
      - integration authority rules change

  template/AGENTS.md:
    role: generated_project_agent_policy
    status: template
    owner: owner
    update_when:
      - governance core is migrated into generated projects
      - role permissions approval gates or lifecycle change
    related:
      - governance/**
      - template/.agent/workflows/sdd-protocol.md

  template/.agent/workflows/sdd-protocol.md:
    role: generated_project_lifecycle_compatibility_contract
    status: template
    owner: architect
    update_when:
      - lifecycle is normalized against governance/lifecycle.md
      - review verifier or drift semantics change

  template/.codex/**:
    role: current_codex_runtime_compatibility_layer
    status: runtime_adapter
    owner: maintainer
    update_when:
      - Codex custom agents hooks or config change
      - the Codex adapter migration advances
    related:
      - runtimes/codex/**

  template/.claude/**:
    role: current_claude_code_runtime_compatibility_layer
    status: runtime_adapter
    owner: maintainer
    update_when:
      - Claude Code agents hooks plugins or skills change
      - the Claude Code adapter migration advances
    related:
      - runtimes/claude-code/**

  template/docs/engineering-memory/**:
    role: generated_project_engineering_memory_starters
    status: template
    owner: architect
    related:
      - framework/memory/project-engineering-memory.md

  template/docs/templates/verification-report-template.md:
    role: generated_project_verification_evidence_template
    status: template
    owner: verifier
    update_when:
      - verification metadata evidence or verdict contract changes

  template/docs/templates/closeout-report-template.md:
    role: generated_project_closeout_template
    status: template
    owner: orchestrator
    update_when:
      - successful or reporting-only closeout semantics change

  template/**:
    role: generated_project_source_template
    status: template
    owner: architect
    update_when:
      - generated project structure or policy changes
      - bootstrap required files change

  skills/catalog.yml:
    role: shared_skill_library_navigation_index
    status: normative
    owner: architect
    update_when:
      - a skill is added promoted renamed or removed
      - domain classification changes

  skills/**:
    role: portable_skill_library
    status: normative
    owner: maintainer
    update_when:
      - skill contracts or bootstrap installation change

  handoff/**:
    role: audited_file_based_cross_runtime_transport
    status: integration_adapter
    owner: architect
    update_when:
      - queue lifecycle scope audit recovery or result contract changes
      - migration introduces a dedicated integrations boundary
    related:
      - runtimes/codex/**
      - runtimes/claude-code/**

  framework/workflow/codex-model-routing.md:
    role: codex_model_routing_reference
    status: reference
    owner: architect
    update_when:
      - Codex model classes or routing guidance changes
      - content is migrated into the Codex runtime adapter

  framework/knowledge/opencode-runtime.md:
    role: opencode_runtime_research
    status: reference
    owner: architect
    update_when:
      - OpenCode behavior is verified
      - provider routing or permission behavior changes
      - content is promoted into the OpenCode adapter

  framework/memory/project-engineering-memory.md:
    role: project_engineering_memory_policy
    status: reference
    owner: architect

  framework/**:
    role: reference_knowledge
    status: reference
    owner: maintainer
    update_when:
      - lessons are promoted or reference knowledge changes

  examples/**:
    role: scenario_guides
    status: example
    owner: docs

  archive/**:
    role: private_or_local_archive
    status: local_state
    owner: owner

  graphify-out/**:
    role: generated_discovery_graph
    status: derived
    owner: tooling
