# Machine-readable navigation registry for authority-bearing files and major
# repository zones. Register contracts and boundaries, not every file.

version: 13
scope: framework_repository
architecture: runtime_neutral_control_plane

statuses:
  normative: "source of truth or accepted policy-bearing file"
  template: "copied into generated projects"
  runtime_adapter: "runtime-specific implementation; cannot override governance"
  integration_adapter: "plugin, MCP, external runtime, tool, or transport boundary"
  installation_manifest: "scaffold composition data; grants no authority"
  reference: "background knowledge; does not override policy"
  evidence: "review, verification, evaluation, drift, release-state, CI, integration, or closeout evidence"
  log: "active or historical Work Block state; not general policy"
  example: "illustrative scenario; never mandatory policy"
  generated: "derived output; verify against current source"
  local_state: "machine-local or private state; do not publish by default"

artifact_authority_order:
  - explicit_owner_instruction_for_active_work_block
  - active_workspace_AGENTS_and_governance
  - approved_specification_and_acceptance_criteria
  - accepted_architecture_decisions_and_external_contracts
  - approved_implementation_and_evaluation_plans_and_write_set
  - active_task_decomposition
  - review_verification_evaluation_drift_release_state_integration_and_closeout_evidence
  - durable_engineering_memory
  - runtime_integration_operational_logs_generated_context_and_examples

role_dimensions:
  authority_roles: [owner, orchestrator, architect, critic, coder, reviewer, verifier]
  specializations: [evaluator, drift_auditor, security_reviewer, domain_verifier]
  separate_from_authority:
    - installation_profile
    - runtime
    - model_class
    - actual_model
    - specialization
    - isolation_level
    - tool_availability
    - integration
    - provider
    - hosting_platform_state

installation_profiles:
  source: bootstrap/profiles.json
  engine: bootstrap/bootstrap_project.py
  default: multi-runtime
  canonical: [core, codex, claude-code, opencode, multi-runtime]
  aliases:
    minimal: core
    generic: core
    full: multi-runtime
  generated_state: .agent/bootstrap-profile.json
  authority: none
  rules:
    - validate_before_target_mutation
    - required_paths_validate_expected_filesystem_kind
    - blocked_default_work_block_validates_before_restore
    - evaluation_contract_available_in_every_profile
    - selected_runtime_surfaces_only
    - no_automatic_integration_activation
    - no_credentials_or_provider_binding
    - work_block_authority_remains_separate

evaluation_assurance:
  contract: governance/evaluation.md
  plan_template: template/docs/templates/evaluation-plan-template.json
  report_template: template/docs/templates/evaluation-report-template.json
  event_template: template/docs/templates/trajectory-event-template.json
  generated_validator: template/scripts/validate-evaluation.py
  contract_fixtures: scripts/test-evaluation-contracts.py
  publication_validator: scripts/validate_evaluation_publication.py
  evidence_boundary: observable_events_only
  hidden_reasoning_required: false
  authority: none

repair_assurance:
  mode: controlled_ndr_only
  repair_record_template: template/docs/templates/repair-record-template.md
  combined_assurance_template: template/docs/templates/combined-assurance-report-template.md
  validator: template/scripts/repair-lifecycle.py
  provider_snapshot: ci_artifact_only
  authority: none

migration_state:
  completed_work_blocks:
    - docs/plans/wb-001-runtime-neutral-control-plane.md
    - docs/plans/wb-002-runtime-neutral-template-convergence.md
    - docs/plans/wb-003-codex-native-agents-and-gates.md
    - docs/plans/wb-004-integration-adapter-normalization.md
    - docs/plans/wb-005-profile-aware-bootstrap-conformance.md
    - docs/plans/wb-006-bootstrap-restore-hardening.md
    - docs/plans/wb-007-agent-evaluation-trajectory-assurance.md
    - docs/plans/wb-008-post-merge-ssot-release-gate.md
    - docs/plans/WB-2026-07-28-risk-tiered-repair-lifecycle.md
  active_work_block: null
  planned: []

release_state:
  contract: governance/release-state.md
  validator: scripts/validate-release-state.py
  fixtures: scripts/test-release-state-contracts.py
  workflow: .github/workflows/release-state-contract.yml
  latest_completed_work_block: docs/plans/WB-2026-07-28-risk-tiered-repair-lifecycle.md
  closeout_report: docs/reports/closeout/wb-009-risk-tiered-repair-lifecycle.md
  external_vcs_state: non_normative
  authority: assurance_only

entries:
  governance/**:
    role: runtime_neutral_governance_core
    status: normative
    owner: architect
    related: [governance/README.md, runtimes/**, integrations/**]

  governance/README.md:
    role: governance_entrypoint
    status: normative
    owner: architect

  governance/authority.md:
    role: logical_roles_and_authority_boundaries
    status: normative
    owner: owner

  governance/lifecycle.md:
    role: runtime_neutral_lifecycle_contract
    status: normative
    owner: architect

  governance/artifacts.md:
    role: portable_artifact_and_ssot_contract
    status: normative
    owner: architect

  governance/evaluation.md:
    role: deterministic_output_and_observable_trajectory_evaluation_contract
    status: normative
    owner: architect
    authority: assurance_only

  governance/release-state.md:
    role: repository_ssot_reconciliation_and_external_vcs_boundary
    status: normative
    owner: architect
    authority: assurance_only

  governance/runtime-capabilities.md:
    role: runtime_capability_negotiation
    status: normative
    owner: architect

  runtimes/**:
    role: runtime_adapter_collection
    status: runtime_adapter
    owner: maintainer
    related: [governance/runtime-capabilities.md, governance/authority.md, governance/evaluation.md, integrations/**]

  runtimes/codex/**:
    role: codex_runtime_adapter
    status: runtime_adapter
    owner: maintainer

  runtimes/claude-code/**:
    role: claude_code_runtime_adapter
    status: runtime_adapter
    owner: maintainer

  runtimes/opencode/**:
    role: opencode_runtime_adapter
    status: runtime_adapter
    owner: maintainer

  runtimes/generic/**:
    role: generic_sequential_agent_baseline
    status: runtime_adapter
    owner: architect
